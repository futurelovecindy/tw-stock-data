name: Daily Stock Data Updater

on:
  schedule:
    # 伺服器時間為 UTC，9:30 等於台灣時間下午 17:30 (每週一到週五)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕觸發更新

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 把更新後的檔案寫回 Repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python update_data.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add stock_latest.json
          # 如果資料有變動才 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock data" && git push)
